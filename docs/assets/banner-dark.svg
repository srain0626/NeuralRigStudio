<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" role="img" aria-label="NeuralRig Studio — Real-Time Circuit and Neural Guitar DSP Workstation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="100%" stop-color="#111218"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Chassis Background -->
  <rect width="920" height="200" rx="12" fill="url(#bg)"/>
  <rect width="920" height="200" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="919" height="199" rx="11.5" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Pulse Icon Mark -->
  <rect x="36" y="36" width="34" height="34" rx="8" fill="#18181b" stroke="#ef233c" stroke-opacity="0.65" stroke-width="1.2"/>
  <g transform="translate(41, 41)">
    <path d="M2 12h4l2.5-7 3.5 14 2.5-7H22" fill="none" stroke="#ef233c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eyebrow -->
  <text x="82" y="57" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1">.NET 10  ·  AVX2 / FMA  ·  0 B RT ALLOC</text>

  <!-- Title & Technical Summary -->
  <text x="36" y="108" fill="#fafafa" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="-0.6">NeuralRig Studio</text>
  <text x="36" y="137" fill="#a1a1aa" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">Component-level analog circuit modeling, native .nam inference,</text>
  <text x="36" y="157" fill="#a1a1aa" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">and 2×8 parallel signal routing for Windows ASIO / WASAPI.</text>

  <!-- Right Panel: 2x8 Parallel Signal Matrix Schematic -->
  <rect x="524" y="24" width="368" height="152" rx="10" fill="#09090c" stroke="#27272a" stroke-width="1"/>
  <text x="542" y="45" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.9">2×8 SIGNAL MATRIX</text>
  <circle cx="803" cy="41.5" r="3" fill="#22c55e"/>
  <text x="874" y="45" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">0.65ms / 256fr</text>
  <line x1="524" y1="55" x2="892" y2="55" stroke="#1f1f23" stroke-width="1"/>

  <!-- Signal Routing Wires -->
  <line x1="540" y1="84" x2="658" y2="84" stroke="#52525b" stroke-width="1.5"/>
  <line x1="658" y1="84" x2="768" y2="84" stroke="#52525b" stroke-width="1.5"/>
  <path d="M 658 84 C 664 84, 662 126, 670 126 L 758 126 C 766 126, 763 84, 768 84" fill="none" stroke="#52525b" stroke-width="1.5"/>
  <line x1="768" y1="84" x2="878" y2="84" stroke="#52525b" stroke-width="1.5"/>

  <!-- Split / Merge Nodes -->
  <circle cx="540" cy="84" r="3" fill="#a1a1aa"/>
  <circle cx="658" cy="84" r="3" fill="#facc15"/>
  <circle cx="768" cy="84" r="3" fill="#facc15"/>
  <circle cx="878" cy="84" r="3" fill="#22c55e"/>

  <!-- Row 1 Blocks -->
  <rect x="556" y="71" width="42" height="26" rx="5" fill="#18181b" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="577" y="87.5" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">GATE</text>

  <rect x="606" y="71" width="42" height="26" rx="5" fill="#18181b" stroke="#f97316" stroke-width="1.2"/>
  <text x="627" y="87.5" text-anchor="middle" fill="#fed7aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">TS808</text>

  <rect x="670" y="71" width="44" height="26" rx="5" fill="#18181b" stroke="#ef233c" stroke-width="1.2"/>
  <text x="692" y="87.5" text-anchor="middle" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">PLEXI</text>

  <rect x="720" y="71" width="38" height="26" rx="5" fill="#18181b" stroke="#7c5cff" stroke-width="1.2"/>
  <text x="739" y="87.5" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">V30</text>

  <rect x="776" y="71" width="44" height="26" rx="5" fill="#18181b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="798" y="87.5" text-anchor="middle" fill="#bbf7d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">DC-2W</text>

  <rect x="826" y="71" width="42" height="26" rx="5" fill="#18181b" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="847" y="87.5" text-anchor="middle" fill="#99f6e4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">1/8.</text>

  <!-- Row 2 Parallel Blocks -->
  <rect x="670" y="113" width="44" height="26" rx="5" fill="#18181b" stroke="#e4e4e7" stroke-width="1.2"/>
  <text x="692" y="129.5" text-anchor="middle" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">NAM</text>

  <rect x="720" y="113" width="38" height="26" rx="5" fill="#18181b" stroke="#7c5cff" stroke-width="1.2"/>
  <text x="739" y="129.5" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600">1960</text>

  <!-- Telemetry Footer inside Card -->
  <text x="542" y="162" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">4× HIIR (-133dB) · 72 MODELS · MIDI CC · MCP PIPE</text>
</svg>
