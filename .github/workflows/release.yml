name: Release NeuralRig Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release SemVer (without leading v)"
        required: true
        default: "3.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}".StartsWith("v")) {
            $v = "${{ github.ref_name }}".Substring(1)
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install & Build Web UI
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build

      - name: Build Solution & Run RigBench Gate
        shell: pwsh
        run: |
          dotnet build NeuralRigStudio.sln -c Release
          & ".\tools\RigBench\bin\Release\net10.0-windows\RigBench.exe"

      - name: Test & Pack neuralrig-mcp
        shell: pwsh
        run: |
          node packages/neuralrig-mcp/test/verify-mcp.mjs
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          npm pack ./packages/neuralrig-mcp --pack-destination dist-release

      - name: Verify Next.js Cloud Build
        run: |
          npm --prefix cloud ci
          npm --prefix cloud run build

      - name: Build Windows Installer & Standalone Single-File EXE
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/*.tgz
            dist-release/SHA256SUMS.txt
